<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="64" fill="#0a0a1a"/>
  <g transform="translate(256, 230)">
    <!-- Graduation cap top -->
    <polygon points="0,-80 -140,0 0,40 140,0" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="6" stroke-linejoin="round"/>
    <!-- Cap brim line -->
    <line x1="0" y1="40" x2="0" y2="-80" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4" opacity="0.3"/>
    <!-- Tassel string -->
    <line x1="140" y1="0" x2="160" y2="60" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <!-- Tassel end -->
    <circle cx="160" cy="68" r="8" fill="#22d3ee" fill-opacity="0.5"/>
    <!-- Bottom drape left -->
    <path d="M-90,20 Q-90,80 -60,100" stroke="#22d3ee" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Bottom drape right -->
    <path d="M90,20 Q90,80 60,100" stroke="#22d3ee" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Bottom connection -->
    <path d="M-60,100 Q0,120 60,100" stroke="#22d3ee" stroke-width="5" fill="#22d3ee" fill-opacity="0.1" stroke-linecap="round"/>
  </g>
</svg>
